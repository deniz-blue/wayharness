name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libpixman-1-dev libxkbcommon-dev xkb-data dbus at-spi2-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -m 700 "$RUNNER_TEMP/runtime"
      - run: cargo test
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/runtime
